name: Build Pink Tune APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'animations.css'
      - 'profile.css'
      - 'app.js'
      - 'supabase-config.js'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'sw.js'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Get source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install Capacitor
        run: npm install

      - name: Prepare app and Android project
        run: |
          npm run prepare:android
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Pink-Tune.apk

      - name: Publish direct download
        uses: softprops/action-gh-release@v3
        with:
          tag_name: android-v${{ github.run_number }}
          name: Pink Tune Android ${{ github.run_number }}
          make_latest: true
          token: ${{ github.token }}
          files: Pink-Tune.apk
